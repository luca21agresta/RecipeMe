<head>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #fffaf3;
      color: #2b2b2b;
      line-height: 1.5;
    }

    header {
      background: linear-gradient(135deg, #ff7043, #ffb74d);
      color: white;
      padding: 28px 7%;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo span {
      color: #fff3cd;
    }

    .nav-links {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-weight: 700;
    }

    .hero {
      padding: 70px 7% 50px;
      text-align: center;
      background: radial-gradient(circle at top, #fff1dd, #fffaf3 65%);
    }

    .hero h1 {
      font-size: clamp(2.2rem, 5vw, 4.5rem);
      color: #e65100;
      margin-bottom: 16px;
      line-height: 1.05;
    }

    .hero p {
      max-width: 760px;
      margin: 0 auto 28px;
      font-size: 1.15rem;
      color: #555;
    }

    .search-box {
      max-width: 850px;
      margin: 0 auto;
      background: white;
      display: flex;
      border-radius: 999px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0,0,0,0.12);
      border: 1px solid #ffe0b2;
    }

    .search-box input {
      flex: 1;
      padding: 19px 24px;
      border: none;
      outline: none;
      font-size: 1rem;
    }

    .search-box button {
      border: none;
      background: #ff7043;
      color: white;
      padding: 0 28px;
      font-weight: 800;
      cursor: pointer;
      font-size: 1rem;
    }

    .filters {
      padding: 28px 7% 10px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-btn {
      border: 2px solid #ffb74d;
      background: white;
      color: #e65100;
      padding: 11px 18px;
      border-radius: 999px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: #ff7043;
      color: white;
      border-color: #ff7043;
    }

    .stats {
      padding: 10px 7% 20px;
      text-align: center;
      color: #666;
      font-weight: 700;
    }

    .recipe-grid {
      padding: 25px 7% 70px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 24px;
    }

    .card {
      background: white;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 8px 22px rgba(0,0,0,0.08);
      border: 1px solid #ffe0b2;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card-img {
      height: 165px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      background: linear-gradient(135deg, #fff3e0, #ffe0b2);
    }

    .card-content {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .tag {
      display: inline-block;
      width: fit-content;
      background: #fff3e0;
      color: #e65100;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .card h3 {
      font-size: 1.25rem;
      margin-bottom: 8px;
      color: #222;
    }

    .meta {
      color: #666;
      font-size: 0.92rem;
      margin-bottom: 12px;
    }

    .card p {
      color: #555;
      margin-bottom: 14px;
      flex: 1;
    }

    .card button {
      margin-top: auto;
      border: none;
      background: #ff7043;
      color: white;
      padding: 12px 14px;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      padding: 25px;
      overflow-y: auto;
    }

    .modal-content {
      max-width: 850px;
      margin: 30px auto;
      background: white;
      border-radius: 24px;
      padding: 28px;
      position: relative;
    }

    .close {
      position: absolute;
      top: 18px;
      right: 22px;
      font-size: 2rem;
      cursor: pointer;
      color: #777;
    }

    .modal h2 {
      color: #e65100;
      margin-bottom: 8px;
      padding-right: 35px;
    }

    .modal-section {
      margin-top: 22px;
    }

    .modal-section h3 {
      margin-bottom: 8px;
      color: #333;
    }

    .modal ul,
    .modal ol {
      padding-left: 24px;
    }

    .modal li {
      margin-bottom: 8px;
    }

    footer {
      background: #2b2b2b;
      color: white;
      padding: 35px 7%;
      text-align: center;
    }

    footer p {
      color: #ddd;
      margin-top: 8px;
    }

    @media (max-width: 600px) {
      header {
        padding: 22px 5%;
      }

      .search-box {
        flex-direction: column;
        border-radius: 22px;
      }

      .search-box button {
        padding: 15px;
      }
    }
  </style>
</head>

    function renderRecipes(list) {
      const grid = document.getElementById("recipeGrid");
      const stats = document.getElementById("stats");
      grid.innerHTML = "";
      stats.textContent = `Showing ${list.length} recipes out of ${recipes.length}+ total RecipeMe items`;

      if (list.length === 0) {
        grid.innerHTML = `<p style="grid-column:1/-1;text-align:center;font-size:1.2rem;color:#777;">No recipes found. Try another search.</p>`;
        return;
      }

      list.forEach((recipe, index) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-img">${recipe.emoji}</div>
          <div class="card-content">
            <span class="tag">${recipe.type}</span>
            <h3>${recipe.name}</h3>
            <div class="meta">${recipe.cuisine} • ${recipe.time} • ${recipe.difficulty}</div>
            <p>${recipe.description}</p>
            <button onclick="openRecipe(${recipes.indexOf(recipe)})">View Recipe</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterRecipes(type, button) {
      currentFilter = type;
      document.querySelectorAll(".filter-btn").forEach(btn => btn.classList.remove("active"));
      button.classList.add("active");
      searchRecipes();
    }

    function searchRecipes() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      let filtered = recipes.filter(recipe => {
        const matchesFilter = currentFilter === "All" || recipe.type === currentFilter;
        const matchesSearch =
          recipe.name.toLowerCase().includes(query) ||
          recipe.type.toLowerCase().includes(query) ||
          recipe.cuisine.toLowerCase().includes(query) ||
          recipe.description.toLowerCase().includes(query) ||
          recipe.ingredients.join(" ").toLowerCase().includes(query);
        return matchesFilter && matchesSearch;
      });
      renderRecipes(filtered);
    }

    function openRecipe(index) {
      const recipe = recipes[index];
      const modal = document.getElementById("recipeModal");
      const modalBody = document.getElementById("modalBody");

      modalBody.innerHTML = `
        <h2>${recipe.emoji} ${recipe.name}</h2>
        <p><strong>Type:</strong> ${recipe.type} | <strong>Cuisine:</strong> ${recipe.cuisine} | <strong>Time:</strong> ${recipe.time} | <strong>Difficulty:</strong> ${recipe.difficulty}</p>
        <p style="margin-top:12px;">${recipe.description}</p>

        <div class="modal-section">
          <h3>Ingredients</h3>
          <ul>${recipe.ingredients.map(item => `<li>${item}</li>`).join("")}</ul>
        </div>

        <div class="modal-section">
          <h3>Instructions</h3>
          <ol>${recipe.steps.map(step => `<li>${step}</li>`).join("")}</ol>
        </div>
      `;

      modal.style.display = "block";
    }

    function closeModal() {
      document.getElementById("recipeModal").style.display = "none";
    }

    window.onclick = function(event) {
      const modal = document.getElementById("recipeModal");
      if (event.target === modal) {
        closeModal();
      }
    };

    document.getElementById("searchInput").addEventListener("input", searchRecipes);

    renderRecipes(recipes);
